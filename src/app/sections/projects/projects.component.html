<section class="projects">
  <div class="container">
    <div class="section-header">
      <h2>Featured Projects</h2>
      <p>Showcase of enterprise solutions and technical expertise</p>
    </div>

    <div class="projects-filters">
      <button *ngFor="let tech of getTechs()"
              class="filter-btn"
              [class.active]="selectedTech === tech"
              (click)="selectedTech = tech">
        {{ tech }}
      </button>
    </div>

    <div class="projects-grid">
      <div *ngFor="let project of filteredProjects()" class="project-card">
        <div class="project-image">
          <img [src]="project.image" [alt]="project.title" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22100%25%22 height=%22100%25%22 viewBox=%220 0 24 24%22%3E%3Crect fill=%22%23ddd%22 width=%2224%22 height=%2224%22/%3E%3Ctext x=%2250%25%22 y=%2250%25%22 font-size=%2212%22 fill=%22%23999%22 text-anchor=%22middle%22 dy=%22.3em%22%3EProject Image%3C/text%3E%3C/svg%3E'">
          <div class="overlay">
            <div class="overlay-content">
              <a href="#" class="overlay-link">View Details</a>
              <a href="#" class="overlay-link" *ngIf="project.featured">GitHub</a>
            </div>
          </div>
        </div>

        <div class="project-content">
          <h3>{{ project.title }}</h3>
          <p>{{ project.description }}</p>
          
          <div class="technologies">
            <span *ngFor="let tech of project.technologies" class="tech-badge">
              {{ tech }}
            </span>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
